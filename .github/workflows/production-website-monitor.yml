name: Production Website Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-website-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run read-only production smoke checks
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          details="$(node scripts/smoke-production.mjs --base-url https://anointed-worship-app.vercel.app 2>&1)"
          status=$?
          printf '%s\n' "$details"
          {
            echo 'details<<SMOKE_OUTPUT'
            printf '%s\n' "$details" | head -c 6000
            echo
            echo 'SMOKE_OUTPUT'
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Open one assigned incident issue
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          SMOKE_DETAILS: ${{ steps.smoke.outputs.details }}
        with:
          script: |
            const marker = '<!-- anointed-worship-production-monitor -->';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );

            if (!existing) {
              const details = (process.env.SMOKE_DETAILS || 'No smoke output was captured.').slice(0, 6000);
              await github.rest.issues.create({
                ...context.repo,
                title: '[production-monitor] Website smoke failed',
                assignees: [context.repo.owner],
                body: [
                  marker,
                  'The scheduled read-only production website smoke check failed.',
                  '',
                  '```text',
                  details,
                  '```',
                  '',
                  `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `Detected: ${new Date().toISOString()}`,
                  '',
                  'Use `docs/WEBSITE-OPERATIONS.md` for incident checks and rollback guidance.',
                ].join('\n'),
              });
            }

      - name: Close the monitor issue after recovery
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const marker = '<!-- anointed-worship-production-monitor -->';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Production smoke recovered at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Preserve a failing workflow status
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1
